<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Album - আমার স্মৃতি</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #0a0e27 0%, #1a1f4b 40%, #2d1b69 70%, #0f0c29 100%);
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* ===== NIGHT SKY STARS ===== */
    .stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4); }
    }

    /* Shooting star */
    .shooting-star {
      position: absolute;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
      animation: shoot 3s linear infinite;
      opacity: 0;
      z-index: 1;
    }

    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
      100% { transform: translateX(500px) translateY(500px) rotate(-45deg); opacity: 0; }
    }

    /* ===== TITLE (NO GLASSMORPHISM) ===== */
    .overlay {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      padding: 20px 40px;
    }

    .overlay h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(255,255,255,0.5), 0 0 60px rgba(168, 237, 234, 0.3);
    }

    .overlay p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.85);
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* ===== AUTO-SLIDE CAROUSEL ===== */
    .carousel-container {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 400px;
      perspective: 1200px;
      z-index: 5;
    }

    .carousel-track {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: autoSlide 12s infinite linear;
    }

    @keyframes autoSlide {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .carousel-item {
      position: absolute;
      width: 260px;
      height: 340px;
      left: 50%;
      top: 50%;
      margin-left: -130px;
      margin-top: -170px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 
        0 10px 40px rgba(0,0,0,0.6),
        0 0 30px rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.15);
      backface-visibility: hidden;
      transition: transform 0.3s ease;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-item:hover {
      transform: scale(1.08);
      box-shadow: 
        0 15px 50px rgba(0,0,0,0.7),
        0 0 40px rgba(168, 237, 234, 0.3);
    }

    /* ===== MUSIC BUTTON ===== */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(168, 237, 234, 0.4);
    }

    /* ===== UPLOAD BOX ===== */
    .upload-box {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 15px 30px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .upload-box:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 30px rgba(168, 237, 234, 0.2);
    }

    .upload-box input[type="file"] {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .upload-box input[type="file"]::-webkit-file-upload-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
      transition: all 0.3s ease;
    }

    .upload-box input[type="file"]::-webkit-file-upload-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* ===== MOON ===== */
    .moon {
      position: fixed;
      top: 10%;
      right: 15%;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 30% 30%, #fffef0, #f5f3ce);
      border-radius: 50%;
      box-shadow: 
        0 0 60px rgba(255, 254, 240, 0.3),
        0 0 100px rgba(255, 254, 240, 0.1);
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      from { box-shadow: 0 0 60px rgba(255, 254, 240, 0.3), 0 0 100px rgba(255, 254, 240, 0.1); }
      to { box-shadow: 0 0 80px rgba(255, 254, 240, 0.5), 0 0 120px rgba(255, 254, 240, 0.2); }
    }

    /* ===== CAROUSEL NAVIGATION DOTS ===== */
    .carousel-dots {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 50;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
      transform: scale(1.3);
    }
  </style>
</head>

<body>
  <!-- Night Sky Stars -->
  <div class="stars-container" id="starsContainer"></div>

  <!-- Moon -->
  <div class="moon"></div>

  <!-- Title (No Glassmorphism) -->
  <div class="overlay">
    <h1>আমার স্মৃতি</h1>
    <p>একটা গল্প, ছবির ভেতরে লুকানো...</p>
  </div>

  <!-- Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" onclick="toggleMusic()">🎵</button>

  <!-- Auto-Slide 3D Carousel -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack"></div>
  </div>

  <!-- Carousel Dots -->
  <div class="carousel-dots" id="carouselDots"></div>

  <!-- Upload -->
  <div class="upload-box">
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <script>
    // ===== GENERATE STARS =====
    const starsContainer = document.getElementById('starsContainer');
    const starCount = 200;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.classList.add('star');

      const size = Math.random() * 3 + 1;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const duration = Math.random() * 3 + 2;
      const delay = Math.random() * 5;

      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = x + '%';
      star.style.top = y + '%';
      star.style.setProperty('--duration', duration + 's');
      star.style.setProperty('--delay', delay + 's');

      starsContainer.appendChild(star);
    }

    // ===== SHOOTING STARS =====
    function createShootingStar() {
      const shootingStar = document.createElement('div');
      shootingStar.classList.add('shooting-star');
      shootingStar.style.top = Math.random() * 50 + '%';
      shootingStar.style.left = Math.random() * 50 + '%';
      shootingStar.style.animationDuration = (Math.random() * 2 + 1) + 's';
      starsContainer.appendChild(shootingStar);

      setTimeout(() => shootingStar.remove(), 3000);
    }

    setInterval(createShootingStar, 4000);

    // ===== MUSIC TOGGLE =====
    function toggleMusic() {
      const music = document.getElementById("bgMusic");
      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }

    // ===== CAROUSEL LOGIC =====
    const carouselTrack = document.getElementById("carouselTrack");
    const carouselDots = document.getElementById("carouselDots");
    const input = document.getElementById("fileInput");

    let images = JSON.parse(localStorage.getItem("albumImages")) || [];
    let currentIndex = 0;

    function saveImages() {
      localStorage.setItem("albumImages", JSON.stringify(images));
    }

    function renderCarousel() {
      carouselTrack.innerHTML = "";
      carouselDots.innerHTML = "";

      if (images.length === 0) {
        carouselTrack.innerHTML = '<div class="empty-state">📷 ছবি আপলোড করুন</div>';
        return;
      }

      const angle = 360 / images.length;

      images.forEach((src, i) => {
        const item = document.createElement("div");
        item.classList.add("carousel-item");

        const img = document.createElement("img");
        img.src = src;
        item.appendChild(img);

        const rotateY = angle * i;
        item.style.transform = `rotateY(${rotateY}deg) translateZ(350px)`;

        carouselTrack.appendChild(item);

        // Create dot
        const dot = document.createElement("div");
        dot.classList.add("dot");
        if (i === 0) dot.classList.add("active");
        dot.addEventListener("click", () => goToSlide(i));
        carouselDots.appendChild(dot);
      });
    }

    function goToSlide(index) {
      currentIndex = index;
      const dots = document.querySelectorAll(".dot");
      dots.forEach((d, i) => {
        d.classList.toggle("active", i === index);
      });

      const angle = 360 / images.length;
      carouselTrack.style.animation = 'none';
      carouselTrack.style.transform = `rotateY(${-angle * index}deg)`;

      setTimeout(() => {
        carouselTrack.style.animation = '';
      }, 100);
    }

    input.addEventListener("change", (e) => {
      const files = e.target.files;

      for (let file of files) {
        const reader = new FileReader();

        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;

          img.onload = function() {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            const maxWidth = 800;
            const scale = maxWidth / img.width;

            canvas.width = maxWidth;
            canvas.height = img.height * scale;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const compressed = canvas.toDataURL("image/jpeg", 0.7);

            images.push(compressed);
            saveImages();
            renderCarousel();
          };
        };

        reader.readAsDataURL(file);
      }
    });

    // Load saved images on start
    renderCarousel();
  </script>
</body>
</html>
